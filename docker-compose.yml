# CrabDeck origin stack. `docker compose up -d` publishes :80 so Cloudflare
# can handshake this host (HTTP 521 = nothing listening on the orange-cloud origin).
services:
  gateway:
    build:
      context: ./gateway
    environment:
      HOST: "0.0.0.0"
      PORT: "8765"
      GATEWAY_TOKEN: "${GATEWAY_TOKEN:-}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:5173,https://hermesclaw.ai,https://hermes-claw.ai}"
    ports:
      - "8765:8765"
    restart: unless-stopped

  orchestrator:
    build:
      context: ./orchestrator
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      GATEWAY_URL: "ws://gateway:8765"
      GATEWAY_TOKEN: "${GATEWAY_TOKEN:-}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:5173,https://hermesclaw.ai,https://hermes-claw.ai}"
    ports:
      - "8000:8000"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

  origin:
    image: caddy:2.8-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
